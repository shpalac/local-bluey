# Project adapter for agent-team-kit factory v1. This records REAL behavior.
# Do not set adoption.mode: enforced until authenticated controller,
# lease fencing, protected gates, and a live canary are verified.
schema_version: 1
repository:
  full_name: shpalac/local-bluey
  default_branch: main
adoption:
  mode: documented
  controller_backend: not_configured
  lease_backend: not_configured
validation:
  required_check: build # existing .github/workflows/ci.yml aggregator
  selection: conservative # tool/ci_impact.py, fails closed on unknown changes
  issue_contract: checklist # issue text + JSON acceptance manifests, not new YAML schema
  runners: [ubuntu-latest, macos-latest, windows-latest]
  allowed_test_roots: [test/, integration_test/, tool/]
delivery:
  reference_syntax: [Refs] # no native Closes, Fixes or Resolves
  auto_merge: true # ONLY explicit AutoClose #N candidates; GitHub rules still apply
  post_merge_close: verified # workflow_run on successful main CI
  independent_review_required: false # NOT independently enforced by current auto-merge script
resources:
  max_concurrent_agents: 3 # aspirational capacity limit; NO controller is deployed
  max_ci_repair_attempts: 3 # documentation target; not automatic today
  heartbeat_minutes: 5
  lease_ttl_minutes: 30
  max_agent_runtime_minutes: 60
  max_tokens_per_issue: 100000
