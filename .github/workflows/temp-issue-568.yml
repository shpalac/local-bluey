name: Temporary BLU-015 acceptance

on:
  pull_request:
    paths:
      - 'lib/workflows/legacy_routine_adapter.dart'
      - 'test/legacy_routine_adapter_test.dart'
      - 'docs/blu-015-legacy-routine-adapter.md'
      - 'docs/acceptance/temporary/issue-568.json'
      - '.github/workflows/temp-issue-568.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blu-015:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Check issue files formatting
        run: |
          dart format lib/workflows/legacy_routine_adapter.dart test/legacy_routine_adapter_test.dart
          git diff -- lib/workflows/legacy_routine_adapter.dart test/legacy_routine_adapter_test.dart
          git diff --exit-code -- lib/workflows/legacy_routine_adapter.dart test/legacy_routine_adapter_test.dart
      - run: dart analyze lib/workflows/legacy_routine_adapter.dart test/legacy_routine_adapter_test.dart
      - run: flutter test test/legacy_routine_adapter_test.dart test/workflow_dsl_test.dart test/routines_test.dart
      - run: flutter analyze
