name: Temporary issue 662 acceptance
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: acceptance-662-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  acceptance:
    name: issue-662-acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Read pinned Flutter version
        run: echo "FLUTTER_VERSION=$(cat .flutter-version)" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Load reviewed acceptance tooling from main
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin main
          echo "Acceptance runner base: $(git rev-parse FETCH_HEAD)"
          mkdir -p tool
          git show FETCH_HEAD:tool/acceptance_criteria.py > tool/acceptance_criteria.py
          git show FETCH_HEAD:tool/test_acceptance_criteria.py > tool/test_acceptance_criteria.py
      - name: Verify manifest contract
        run: python3 -m unittest discover -s tool -p test_acceptance_criteria.py
      - name: Execute exact named acceptance tests
        run: python3 tool/acceptance_criteria.py --manifest docs/acceptance/issue-662.json --run-tests --out-dir build/issue-662-acceptance
      - name: Verify committed screenshot baselines
        run: flutter test test/screenshots/screenshot_harness_test.dart --reporter expanded
      - name: Preserve sanitized evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: issue-662-acceptance-${{ github.event.pull_request.number }}
          path: build/issue-662-acceptance/
          if-no-files-found: warn
          retention-days: 30
