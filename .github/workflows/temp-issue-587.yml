name: Temporary BLU-031 acceptance
on:
  pull_request:
    paths:
      - 'lib/services/voice_verification.dart'
      - 'test/voice_verification_test.dart'
      - 'docs/acceptance/temporary/issue-587.json'
      - '.github/workflows/temp-issue-587.yml'
      - 'docs/blu-031-voice-verification.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  voice-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version-file: .flutter-version
      - run: flutter pub get
      - name: Formatting
        run: dart format --output=none --set-exit-if-changed lib/services/voice_verification.dart test/voice_verification_test.dart
      - run: flutter analyze
      - run: flutter test test/voice_verification_test.dart test/safety_gate_test.dart
      - run: flutter build apk --debug
