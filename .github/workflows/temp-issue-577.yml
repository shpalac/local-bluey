name: Temporary BLU-021 synthetic benchmark
on:
  pull_request:
    paths:
      - 'lib/benchmark/**'
      - 'test/benchmark/**'
      - '.github/workflows/temp-issue-577.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: .flutter-version
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib/benchmark test/benchmark
      - run: flutter analyze lib/benchmark test/benchmark
      - run: flutter test test/benchmark
      - run: flutter build bundle --release
