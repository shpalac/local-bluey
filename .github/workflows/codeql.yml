name: CodeQL

# Static analysis for the native layers (#160): Kotlin (android/) and Swift
# (macos/). The Swift job generates the Flutter macOS config first so the
# CodeQL tracer sees a real xcodebuild. Dart stays with OSV + the pattern scan in the security
# job. Runs on native-code changes and weekly, so new advisories against
# unchanged code are still noticed.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 4 * * 1'

defaults:
  run:
    shell: bash

concurrency:
  group: codeql-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      swift: ${{ steps.select.outputs.swift }}
      kotlin: ${{ steps.select.outputs.kotlin }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: select
        run: python3 tool/ci_control.py select

  # Kotlin compiles fine without a build here: build-mode none analyzes
  # sources directly and needs no Gradle/AGP setup.
  kotlin:
    needs: changes
    if: ${{ github.event_name == 'schedule' || needs.changes.outputs.kotlin == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # upload findings to the Security tab
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3.38.2
        with:
          languages: java-kotlin
          build-mode: none
      - uses: github/codeql-action/analyze@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3.38.2

  # Swift needs a traced build. `flutter build macos --config-only` writes the
  # ephemeral xcfilelists that a direct xcodebuild otherwise fails on.
  swift:
    needs: changes
    if: ${{ github.event_name == 'schedule' || needs.changes.outputs.swift == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 40
    permissions:
      contents: read
      security-events: write # upload findings to the Security tab
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Read Flutter version
        run: echo "FLUTTER_VERSION=$(cat .flutter-version)" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get --enforce-lockfile

      - name: Generate macOS build config
        run: flutter build macos --config-only

      - uses: github/codeql-action/init@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3.38.2
        with:
          languages: swift
          build-mode: manual

      - name: Build macOS for the CodeQL tracer
        run: |
          xcodebuild -workspace macos/Runner.xcworkspace -scheme Runner \
            -configuration Debug -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO build

      - uses: github/codeql-action/analyze@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3.38.2
        with:
          category: /language:swift

  codeql-required:
    if: ${{ always() }}
    needs: [changes, kotlin, swift]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require selected security analysis
        env:
          CI_JOB_RESULTS: ${{ toJSON(needs) }}
          CI_EXPECTED_JOBS: >-
            {"changes":true,"kotlin":${{ github.event_name == 'schedule' || needs.changes.outputs.kotlin == 'true' }},"swift":${{ github.event_name == 'schedule' || needs.changes.outputs.swift == 'true' }}}
        run: python3 tool/ci_control.py gate
