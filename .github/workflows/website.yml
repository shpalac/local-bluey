name: Cinematic website

on:
  pull_request:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
      - 'assets/icons/bluey-*.png'
      - 'docs/screenshots/**'
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
      - 'assets/icons/bluey-*.png'
      - 'docs/screenshots/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bluey-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build / browser / Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: website
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install site dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck Astro and React islands
        run: npm run check
      - name: Build site at GitHub Pages subpath
        run: npm run build
      - name: Check generated HTML and genuine assets
        run: npm run test:static
      - name: Install Chromium for visual tests
        run: npx playwright install --with-deps chromium
      - name: Desktop and mobile browser smoke / screenshots
        run: npm run test:visual
      - name: Set Lighthouse Chrome path
        run: echo "CHROME_PATH=$(node -e 'console.log(require("playwright").chromium.executablePath())')" >> "$GITHUB_ENV"
      - name: Lighthouse accessibility and performance audit
        run: npm run test:lighthouse
      - name: Upload rendered browser screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bluey-site-browser-evidence
          path: website/test-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload Lighthouse audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bluey-site-lighthouse
          path: website/.lighthouseci/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload preview build for PR review
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bluey-site-preview
          path: website/dist/
          if-no-files-found: error
          retention-days: 14
      - name: Configure GitHub Pages
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload static Pages artifact
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: website/dist/

  deploy:
    name: Publish to GitHub Pages
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
