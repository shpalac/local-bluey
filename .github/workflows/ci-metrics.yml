name: CI metrics

# Weekly CI health: median job durations and failure rate over the last 7
# days from the Actions API, posted to the run summary. Opens an issue
# when the failure rate crosses 20% (#159).

on:
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Metrics fixture tests
        run: python3 -m unittest discover -s tool -p test_ci_metrics.py
      - name: Compute metrics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          since=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)
          status=0
          python3 tool/ci_metrics.py --repo "$GITHUB_REPOSITORY" --since "$since" \
            --output metrics.md --counts metrics-counts.txt || status=$?
          cat metrics.md >> "$GITHUB_STEP_SUMMARY"
          # Partial/unavailable metrics are visibly marked and fail the job.
          # Do not open a failure-rate issue from incomplete data.
          [ "$status" -eq 0 ] || exit "$status"
          read -r total rate < metrics-counts.txt
          if [ "$total" -ge 5 ] && [ "$rate" -gt 20 ]; then
            title="CI failure rate at $rate% over the last 7 days"
            if ! gh issue list --state open --search "CI failure rate in:title" --json title -q '.[].title' | grep -q "CI failure rate"; then
              gh issue create --title "$title" --label ci \
                --body "$(cat metrics.md)"$'\n\n'"Opened by the weekly ci-metrics workflow (#159)."
            fi
          fi
