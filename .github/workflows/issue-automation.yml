name: Issue acceptance automation

# This privileged workflow only reads metadata from a CI run and checks out
# trusted main. It must never execute code from an unmerged pull request.
on: # zizmor: ignore[dangerous-triggers] Runs trusted main code only; no PR branch checkout, no PR artifacts or cache.
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

jobs:
  enable-auto-merge:
    if: ${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - name: Verify auto-merge contract
        run: python3 -m unittest discover -s tool -p test_issue_auto_merge.py
      - name: Enable automatic squash merge for complete AutoClose PRs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tool/issue_auto_merge.py

  close-complete-issues:
    if: ${{ github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Verify issue auto-close contract
        run: python3 -m unittest discover -s tool -p test_issue_auto_close.py
      - name: Close fully proven issues after main CI passes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tool/issue_auto_close.py
