name: macOS native build lane

on:
  pull_request:
    paths:
      - 'macos/**'
      - 'ios/**'
      - 'lib/**'
      - '.github/workflows/macos-native-build-lane.yml'

permissions:
  contents: read

jobs:
  macos-native-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
      - run: flutter pub get
      - run: flutter test test/macos_build_lane_manifest_test.dart
      - run: flutter build macos --debug
