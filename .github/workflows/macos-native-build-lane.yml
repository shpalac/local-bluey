name: macOS native build lane

on:
  pull_request:
    paths:
      - 'macos/**'
      - 'ios/**'
      - 'lib/**'
      - '.github/workflows/macos-native-build-lane.yml'

permissions:
  contents: read

jobs:
  macos-native-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Read pinned Flutter version
        run: echo "FLUTTER_VERSION=$(cat .flutter-version)" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get --enforce-lockfile
      # The central CI test lane runs the Dart suites and build-macos checks
      # the Flutter build. This lane uniquely validates the native XCTest.
      - run: flutter build macos --config-only
      - name: Run macOS XCTest target
        run: |
          xcodebuild test \
            -workspace macos/Runner.xcworkspace \
            -scheme Runner \
            -configuration Debug \
            -destination 'platform=macOS' \
            -only-testing:RunnerTests \
            CODE_SIGNING_ALLOWED=NO \
            -quiet
