name: macOS native build lane

on:
  pull_request:
    paths:
      - 'macos/**'
      - 'ios/**'
      - 'lib/**'
      - '.github/workflows/macos-native-build-lane.yml'

permissions:
  contents: read

jobs:
  macos-native-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
      - run: flutter pub get
      - run: flutter test test/macos_build_lane_manifest_test.dart
      - run: flutter build macos --debug
