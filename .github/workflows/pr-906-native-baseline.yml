name: PR 906 exact-SHA native baseline

on:
  pull_request:
    paths:
      - .github/workflows/pr-906-native-baseline.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: d1c087ca8417fb78f591da3d8dce0028b3f19874
      - name: Read pinned Flutter version
        run: echo "FLUTTER_VERSION=$(cat .flutter-version)" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: System packages (identical to CI linux job)
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: |
            clang cmake ninja-build pkg-config
            libgtk-3-dev libayatana-appindicator3-dev
            libsecret-1-dev libjsoncpp-dev
            libavahi-client-dev libasound2-dev
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - run: flutter pub get --enforce-lockfile
      - name: Build Linux release with strict warnings
        run: flutter build linux --release

  baseline-simulator:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: d1c087ca8417fb78f591da3d8dce0028b3f19874
      - name: Read pinned Flutter version
        run: echo "FLUTTER_VERSION=$(cat .flutter-version)" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Pre-boot simulator
        run: tool/simulator_smoke.sh preboot
        timeout-minutes: 3
      - name: Build iOS for simulator (same 15-minute step limit)
        run: |
          set -o pipefail
          flutter build ios --simulator --debug --no-codesign 2>&1 | tee build-simulator.log
        timeout-minutes: 15
      - name: Upload baseline simulator build log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr906-baseline-simulator-log
          path: build-simulator.log
          if-no-files-found: warn
          retention-days: 7

  regenerate-plugin-lockfile:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'ci/pr-906-native-baseline-and-fixes' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - name: Read pinned Flutter version
        run: echo "FLUTTER_VERSION=$(cat .flutter-version)" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve plugin lockfile and push only on change
        run: |
          set -euo pipefail
          flutter pub upgrade tray_manager flutter_secure_storage flutter_secure_storage_linux
          flutter pub get --enforce-lockfile
          if git diff --quiet -- pubspec.lock; then
            echo "pubspec.lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.lock
          git commit -m "Refs #906: regenerate Flutter native plugin lockfile"
          git push origin "HEAD:${{ github.head_ref }}"
