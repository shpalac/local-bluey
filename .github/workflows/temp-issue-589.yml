name: Temporary BLU-033 Home Assistant acceptance
on:
  pull_request:
    paths:
      - 'lib/mcp/home_assistant_adapter.dart'
      - 'test/mcp/home_assistant_adapter_test.dart'
      - 'docs/acceptance/temporary/issue-589.json'
      - '.github/workflows/temp-issue-589.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  home-assistant-fakes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
      - run: flutter pub get
      - name: Verify format and print suggested changes
        run: |
          dart format lib/mcp/home_assistant_adapter.dart test/mcp/home_assistant_adapter_test.dart
          git diff -- lib/mcp/home_assistant_adapter.dart test/mcp/home_assistant_adapter_test.dart
          git diff --exit-code -- lib/mcp/home_assistant_adapter.dart test/mcp/home_assistant_adapter_test.dart
      - run: flutter analyze lib/mcp test/mcp
      - run: flutter test test/mcp/home_assistant_adapter_test.dart test/mcp/mcp_tool_safety_gate_test.dart
      - run: flutter build bundle --release
