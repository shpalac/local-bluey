name: temp-issue-588
on:
  pull_request:
    paths:
      - 'docs/acceptance/temporary/issue-588.json'
      - '.github/workflows/temp-issue-588.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rive-feasibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed
      - run: flutter analyze
      - run: flutter test
