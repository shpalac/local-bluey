name: Temporary Dart format preview
on:
  push:
    branches: [feat/bluey-662-settings-layout]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: echo "FLUTTER_VERSION=$(cat .flutter-version)" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format test/settings_responsive_test.dart
      - run: |
          echo 'FORMATTED_START'
          base64 -w0 test/settings_responsive_test.dart
          echo
          echo 'FORMATTED_END'
