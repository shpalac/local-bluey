name: BLU-026 MCP ToolSpec acceptance
on:
  pull_request:
    paths:
      - 'lib/mcp/**'
      - 'test/mcp/**'
      - '.github/workflows/blu-026-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib/mcp test/mcp
      - run: flutter analyze lib/mcp test/mcp
      - run: flutter test test/mcp/mcp_tool_safety_gate_test.dart
      - run: flutter build web
