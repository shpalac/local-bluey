name: Temporary BLU-018 acceptance
on:
  pull_request:
    paths:
      - 'lib/workflows/postcondition_verifier.dart'
      - 'test/postcondition_verifier_test.dart'
      - 'docs/blu-018-postcondition-verification.md'
      - 'docs/acceptance/temporary/issue-571.json'
      - '.github/workflows/temp-issue-571.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  blu-018:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib/workflows/postcondition_verifier.dart test/postcondition_verifier_test.dart
      - run: dart analyze lib/workflows/postcondition_verifier.dart test/postcondition_verifier_test.dart
      - run: flutter test test/postcondition_verifier_test.dart test/workflow_execution_test.dart
      - run: flutter build web --release
