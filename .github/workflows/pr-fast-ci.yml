name: PR Fast CI Lane

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-fast-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast-ci:
    # Preserve this legacy status/check name until branch protection is
    # verified. Main CI owns format/analyze/tests and the fail-closed gate.
    name: Fast CI (format analyze test)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate central impact routing and fail-closed gate
        run: |
          python3 -m unittest discover -s tool -p test_ci_impact.py
          python3 -m unittest discover -s tool -p test_ci_gate.py
          python3 -m unittest discover -s tool -p test_ci_consolidation.py
