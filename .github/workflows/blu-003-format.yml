name: BLU-003 format patch

on:
  push:
    branches: [feat/blu-003-sensitive-content-gate]
    paths:
      - '.github/workflows/blu-003-format.yml'
      - 'lib/services/sensitive_content_gate.dart'
      - 'lib/services/watch_pipeline.dart'
      - 'lib/services/watch_vision.dart'
      - 'test/sensitive_content_gate_test.dart'
      - 'test/watch_vision_test.dart'
      - 'test/watch_pipeline_test.dart'
      - 'test/watch_driver_test.dart'
      - 'test/watch_driver_lifecycle_test.dart'

permissions:
  contents: write

jobs:
  format:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/blu-003-sensitive-content-gate
      - name: Flutter SDK version
        run: echo "FLUTTER_VERSION=$(cat .flutter-version)" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Canonical Dart formatting
        run: dart format lib/services/sensitive_content_gate.dart lib/services/watch_pipeline.dart lib/services/watch_vision.dart test/sensitive_content_gate_test.dart test/watch_vision_test.dart test/watch_pipeline_test.dart test/watch_driver_test.dart test/watch_driver_lifecycle_test.dart
      - name: Push formatted patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/services/sensitive_content_gate.dart lib/services/watch_pipeline.dart lib/services/watch_vision.dart test/sensitive_content_gate_test.dart test/watch_vision_test.dart test/watch_pipeline_test.dart test/watch_driver_test.dart test/watch_driver_lifecycle_test.dart
          if ! git diff --cached --quiet; then
            git commit -m "style: format BLU-003 gate and regression tests"
            git push origin HEAD:feat/blu-003-sensitive-content-gate
          fi
