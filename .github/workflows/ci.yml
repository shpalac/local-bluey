name: CI

on:
  push:
    branches: [main]
  # No paths-ignore on pull_request: the required checks must report on
  # docs-only PRs too, or branch protection leaves them unmergeable.
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  # Weekly dependency/vulnerability scan so new advisories against an
  # unchanged lockfile are noticed (#144). Only the security and
  # pinned-actions jobs run on schedule.
  schedule:
    - cron: '17 3 * * 1'

# Explicit bash => runs with -eo pipefail, so `flutter ... | tee log`
# fails the step when flutter fails (#142). Without it GitHub uses
# `bash -e`, and the step's exit code becomes tee's (always 0).
defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; jobs escalate only when they must.
permissions:
  contents: read

jobs:
  # Fail-closed impact routing; the required check names remain stable.
  detect:
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      plan: ${{ steps.impact.outputs.plan }}
      static: ${{ steps.impact.outputs.static }}
      docs: ${{ steps.impact.outputs.docs }}
      acceptance: ${{ steps.impact.outputs.acceptance }}
      test: ${{ steps.impact.outputs.test }}
      build_macos: ${{ steps.impact.outputs.build_macos }}
      build_ios: ${{ steps.impact.outputs.build_ios }}
      simulator: ${{ steps.impact.outputs.simulator }}
      android: ${{ steps.impact.outputs.android }}
      android_integration: ${{ steps.impact.outputs.android_integration }}
      linux: ${{ steps.impact.outputs.linux }}
      full_tests: ${{ steps.impact.outputs.full_tests }}
      test_files: ${{ steps.impact.outputs.test_files }}
      android_matrix: ${{ steps.impact.outputs.android_matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Verify impact selection and merge gate fail closed
        run: |
          python3 -m unittest discover -s tool -p test_ci_impact.py
          python3 -m unittest discover -s tool -p test_ci_gate.py
      - name: Select affected CI lanes
        id: impact
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 tool/ci_impact.py

  # Fast lane on Linux: format and static analysis only (#153).
  static:
    needs: detect
    if: ${{ github.event_name != 'schedule' && needs.detect.outputs.static == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Single source of truth: .flutter-version at the repo root (#157).
      - name: Read Flutter version
        run: echo "FLUTTER_VERSION=$(cat .flutter-version)" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get --enforce-lockfile

      - name: Format check
        run: |
          dart format lib test
          if ! git diff --quiet -- lib test; then
            git diff -- lib test
            echo "::error::Dart formatting differs. Run 'dart format lib test' and commit the changes."
            exit 1
          fi

      - name: CI metrics fixtures
        run: python3 -m unittest discover -s tool -p test_ci_metrics.py

      - name: Analyze
        run: flutter analyze

  # Docs lane (#179): dartdoc generation stays warning-free for the
  # public contract files, alongside the in-repo coverage test
  # (test/dartdoc_contracts_test.dart).
  docs:
    needs: detect
    if: ${{ github.event_name != 'schedule' && needs.detect.outputs.docs == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Read Flutter version
        run: echo "FLUTTER_VERSION=$(cat .flutter-version)" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get --enforce-lockfile

      # Pinned dartdoc (#144-style version pinning): 9.0.8+ fixes a
      # RangeError parsing SDK @docImport comments that the
      # Flutter-bundled 9.0.6 crashes on.
      - name: Activate dartdoc
        run: dart pub global activate dartdoc 9.0.9

      - name: Generate API docs, contract files warning-free
        run: |
          dart pub global run dartdoc --output build/dartdoc 2>&1 | tee dartdoc.log
          if grep -E "warning:.*(host_control|native_control|tool_executor|safety_gate|brain)\.dart" dartdoc.log; then
            echo "::error::dartdoc warnings in the contract files (#179)"
            exit 1
          fi

  # Bounded BLU issue acceptance evidence. The job proves named test cases
  # execute; it reports native/manual and missing features as INCOMPLETE.
  # Never close an issue solely because this job is green.
  acceptance-evidence:
    needs: detect
    if: ${{ github.event_name != 'schedule' && needs.detect.outputs.acceptance == 'true' }}
    permissions:
      contents: read
      issues: read
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Read Flutter version
        run: echo "FLUTTER_VERSION=$(cat .flutter-version)" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Validate acceptance manifest and no-false-pass behavior
        run: python3 -m unittest discover -s tool -p test_acceptance_criteria.py
      - name: Validate issue task lifecycle test fixtures
        run: python3 -m unittest discover -s tool -p test_issue_task_ci.py
      - name: Validate acceptance-driven merge and closure fixtures
        run: |
          python3 -m unittest discover -s tool -p test_issue_auto_merge.py
          python3 -m unittest discover -s tool -p test_issue_auto_close.py
      - name: Validate issue creation and edit hygiene fixtures
        run: python3 -m unittest discover -s tool -p test_issue_task_hygiene.py
      - name: Enforce issue contracts and run temporary acceptance tests
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tool/issue_task_ci.py --mode unit
      - name: Check BLU-001..003 acceptance mapping and no-false-pass rules
        if: ${{ github.event_name != 'pull_request' }}
        run: python3 -m unittest discover -s tool -p test_blu_001_003_acceptance.py
      - name: Execute BLU-001..003 named acceptance suites (with manual gaps recorded)
        if: ${{ github.event_name != 'pull_request' }}
        run: python3 tool/blu_001_003_acceptance.py --run-tests --out-dir build/acceptance/blu-001-003
      - name: Execute other issue-linked test suites and report incomplete criteria
        if: ${{ github.event_name != 'pull_request' }}
        run: python3 tool/acceptance_criteria.py --run-tests --out-dir build/acceptance/other-issues
      - name: Upload sanitized issue acceptance report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: acceptance-evidence
          path: build/acceptance/
          if-no-files-found: warn
          retention-days: 14

  # Test lane (#153): unit/widget tests with coverage (thresholds + lcov
  # artifact) and machine-readable results uploaded on every run (#159).
  test:
    needs: detect
    if: ${{ github.event_name != 'schedule' && needs.detect.outputs.test == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Single source of truth: .flutter-version at the repo root (#157).
      - name: Read Flutter version
        run: echo "FLUTTER_VERSION=$(cat .flutter-version)" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get --enforce-lockfile

      - name: Full unit + widget tests (coverage enforced)
        if: ${{ needs.detect.outputs.full_tests == 'true' }}
        run: flutter test --coverage --reporter expanded 2>&1 | tee test-output.log
        timeout-minutes: 8

      - name: Impacted unit + widget tests
        if: ${{ needs.detect.outputs.full_tests != 'true' }}
        env:
          TEST_FILES: ${{ needs.detect.outputs.test_files }}
        run: |
          mapfile -t test_files < <(python3 -c 'import json, os; print("\n".join(json.loads(os.environ["TEST_FILES"])))')
          if [ "${#test_files[@]}" -eq 0 ]; then
            echo "::error::no impacted tests selected; fail closed"
            exit 1
          fi
          flutter test "${test_files[@]}" --reporter expanded 2>&1 | tee test-output.log
        timeout-minutes: 8

      - name: Coverage thresholds (services/, link/) (#136)
        if: ${{ needs.detect.outputs.full_tests == 'true' }}
        run: dart run tool/check_coverage.dart

      - name: Upload coverage report
        if: ${{ needs.detect.outputs.full_tests == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 14

      - name: Upload test logs
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-logs
          path: test-output.log
          retention-days: 7

  # Builds stay on macOS: iOS/macOS outputs need Xcode. Runs in parallel
  # with the static/test fast lanes: the native builds never inspect Dart
  # test results, so gating on them only added wall-clock (#144, #153).
  # Docs-only changes skip this 25-minute lane entirely.
  build-macos:
    needs: detect
    if: ${{ github.event_name != 'schedule' && needs.detect.outputs.build_macos == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Single source of truth: .flutter-version at the repo root (#157).
      - name: Read Flutter version
        run: echo "FLUTTER_VERSION=$(cat .flutter-version)" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get --enforce-lockfile

      - name: Build macOS
        run: flutter build macos 2>&1 | tee build-macos.log
        timeout-minutes: 12

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-logs-macos
          path: build-macos.log
          retention-days: 3

  build-ios:
    needs: detect
    if: ${{ github.event_name != 'schedule' && needs.detect.outputs.build_ios == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Single source of truth: .flutter-version at the repo root (#157).
      - name: Read Flutter version
        run: echo "FLUTTER_VERSION=$(cat .flutter-version)" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get --enforce-lockfile

      - name: Build iOS (no codesign)
        run: flutter build ios --no-codesign 2>&1 | tee build-ios.log
        timeout-minutes: 12

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-logs-ios
          path: build-ios.log
          retention-days: 3

  # iOS simulator smoke (#125): boots a simulator, installs the debug
  # build, launches the app and checks the process survives. Covers the
  # automatable slice of the real-device checklist; hardware-only items
  # (permissions, pairing, kill switch) stay manual.
  simulator:
    if: ${{ github.event_name != 'schedule' && needs.detect.outputs.simulator == 'true' }}
    needs: [detect, static, test]
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Read Flutter version
        run: echo "FLUTTER_VERSION=$(cat .flutter-version)" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get --enforce-lockfile

      - name: Pre-boot simulator (overlaps first-boot migration with the build)
        run: tool/simulator_smoke.sh preboot
        timeout-minutes: 3

      - name: Build iOS for the simulator
        run: flutter build ios --simulator --debug --no-codesign 2>&1 | tee build-simulator.log
        timeout-minutes: 15

      - name: Boot, install, launch, verify
        run: tool/simulator_smoke.sh
        timeout-minutes: 6

      - name: Upload launch screenshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: simulator-launch
          path: build/simulator/
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: simulator-build-log
          path: build-simulator.log
          retention-days: 3

  # Stable aggregate required check: selected jobs must pass; skips are
  # allowed only for non-applicable lanes. Security is required on every PR.
  build:
    if: ${{ always() && github.event_name != 'schedule' }}
    needs: [detect, static, docs, acceptance-evidence, test, build-macos, build-ios, simulator, android, android-integration, linux, security, pinned-actions]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require every selected lane and security check
        env:
          CI_PLAN_JSON: ${{ needs.detect.outputs.plan }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 tool/ci_gate.py

  # Android debug APK on ubuntu - no Xcode needed (#153). Runs in parallel
  # with the fast lanes for the same reason as the macOS builds.
  android:
    needs: detect
    if: ${{ github.event_name != 'schedule' && needs.detect.outputs.android == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Single source of truth: .flutter-version at the repo root (#157).
      - name: Read Flutter version
        run: echo "FLUTTER_VERSION=$(cat .flutter-version)" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Cached Gradle wrapper/distribution + AGP + dependency jars: a cold
      # Gradle setup re-downloads all of them on every run (#speed).
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - run: flutter pub get --enforce-lockfile

      - name: Build Android (debug APK)
        run: flutter build apk --debug 2>&1 | tee build-android.log
        timeout-minutes: 12

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-build-logs
          path: build-android.log
          retention-days: 3

  # Android integration tests on a KVM emulator (#78): boots a pinned
  # emulator and runs integration_test/ against it. The native MethodChannel
  # is mocked in-Dart, so no macOS host is needed.
  android-integration:
    needs: detect
    if: ${{ github.event_name != 'schedule' && needs.detect.outputs.android_integration == 'true' }}
    permissions:
      contents: read
      issues: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: ${{ fromJSON(needs.detect.outputs.android_matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Single source of truth: .flutter-version at the repo root (#157).
      - name: Read Flutter version
        run: echo "FLUTTER_VERSION=$(cat .flutter-version)" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Gradle is exercised through `flutter test integration_test`; a warm
      # Gradle home saves the wrapper + AGP + dependency re-download (#speed).
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - run: flutter pub get --enforce-lockfile

      # KVM is required for x86_64 emulators on GitHub-hosted runners.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run integration tests on the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          profile: pixel_6
          # android-emulator-runner executes this via /bin/sh, not bash.
          # Keep it one POSIX-compatible command; non-PR events no-op in Python.
          script: GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}" python3 tool/issue_task_ci.py --mode integration && flutter test integration_test --reporter expanded

  # Linux client build + tests on the generated linux/ runner (#149).
  # GTK3 stack + plugin system deps: tray_manager (ayatana-appindicator),
  # flutter_secure_storage (libsecret, libjsoncpp), nsd (Avahi),
  # record/audioplayers (ALSA), window_manager (GTK).
  linux:
    needs: detect
    if: ${{ github.event_name != 'schedule' && needs.detect.outputs.linux == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Single source of truth: .flutter-version at the repo root (#157).
      - name: Read Flutter version
        run: echo "FLUTTER_VERSION=$(cat .flutter-version)" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # GTK3 stack + plugin system deps, cached so the ~1-2 min apt
      # download/update is skipped on warm runs (#speed):
      # tray_manager (ayatana-appindicator), flutter_secure_storage
      # (libsecret, libjsoncpp), nsd (Avahi), record/audioplayers (ALSA),
      # window_manager (GTK), GStreamer for media plugins.
      - name: System packages (apt cache)
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          # Dev packages register headers statically; the runtime libs the
          # Flutter plugins link against are plain filesets. No pre/postinst
          # needs here, so install scripts stay off (action caveat: the
          # caveat path is for packages whose postinst must register
          # services/users) and no `version` bump is needed when the list
          # changes - the action hashes the package list into the cache key.
          packages: |
            clang cmake ninja-build pkg-config
            libgtk-3-dev libayatana-appindicator3-dev
            libsecret-1-dev libjsoncpp-dev
            libavahi-client-dev libasound2-dev
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - run: flutter pub get --enforce-lockfile

      # Dedicated test lane handles unit tests; Linux still exercises X11 E2E.

      # Phone <-> Linux host E2E under a real X server (#154): the link
      # protocol pairs over loopback TCP and the X11 backend drives
      # xdotool against Xvfb instead of a mocked runner.
      - name: X11 host E2E under Xvfb (#154)
        run: |
          sudo apt-get install -y xvfb xdotool x11-utils
          xvfb-run -a -s '-screen 0 1280x1024x24' flutter test test/e2e_phone_host_test.dart --reporter expanded

      - name: Build Linux (release)
        run: flutter build linux --release

      - name: Package Linux tarball (#152)
        run: |
          set -euo pipefail
          bundle=$(echo build/linux/*/release/bundle)
          version=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          name="local-bluey-linux-x86_64-${version}"
          mkdir -p dist
          tar -C "$(dirname "$bundle")" -czf "dist/${name}.tar.gz" "$(basename "$bundle")"
          echo "PACKAGED=${name}.tar.gz" >> "$GITHUB_STEP_SUMMARY"
          sha256sum "dist/${name}.tar.gz" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Linux tarball
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-tarball
          path: dist/*.tar.gz
          retention-days: 14

      - name: Upload Linux bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-bundle
          path: build/linux/**/release/bundle
          retention-days: 14

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # gitleaks scans history

      # No flutter-action here: every scanner below works on source files
      # and the lockfile, never on the Dart toolchain (#speed). Dropping
      # the SDK download + pub get trims the job by ~1 minute.

      # Pinned version + checksum, verified before execution (#144). Bump
      # deliberately: fetch the release asset and sha256sum it locally.
      - name: Dependency vulnerability scan (OSV)
        env:
          OSV_VERSION: v2.6.0
          OSV_SHA256: ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108
        run: |
          curl -sfL "https://github.com/google/osv-scanner/releases/download/${OSV_VERSION}/osv-scanner_linux_amd64" -o /tmp/osv-scanner
          echo "${OSV_SHA256}  /tmp/osv-scanner" | sha256sum --check
          chmod +x /tmp/osv-scanner
          /tmp/osv-scanner scan --lockfile=pubspec.lock

      # gitleaks: free for personal repos; an org repo would need a
      # GITLEAKS_LICENSE secret (#144). Fork PRs get a read-only token and
      # the scan reports without blocking on write checks.
      - name: Secrets scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SUMMARY: "true"

      # Pattern scan over Swift/Kotlin sources (#160): hardcoded secrets,
      # private keys, tokens. Fails the job on any hit.
      - name: Swift/Kotlin secrets pattern scan
        run: .github/scripts/scan-native-secrets.sh macos ios android

  # Fails if any third-party action is referenced by a movable tag instead of
  # a full-length commit SHA. The check matches both `- uses:` and bare
  # `uses:` forms (#143) and carries its own negative test.
  pinned-actions:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify actions are pinned by SHA
        run: .github/scripts/check-pinned-actions.sh

      # Workflow lint (#160): actionlint for semantics, zizmor for security
      # audits. Both pinned by version + sha256 like the OSV scan (#144);
      # bump deliberately after verifying the new checksum.
      - name: Workflow lint (actionlint)
        env:
          AL_VERSION: 1.7.12
          AL_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -sfL "https://github.com/rhysd/actionlint/releases/download/v${AL_VERSION}/actionlint_${AL_VERSION}_linux_amd64.tar.gz" -o /tmp/al.tgz
          echo "${AL_SHA256}  /tmp/al.tgz" | sha256sum --check
          tar -xzf /tmp/al.tgz -C /tmp actionlint
          /tmp/actionlint .github/workflows/*.yml

      - name: Workflow security audit (zizmor)
        env:
          ZM_VERSION: 1.30.1
          ZM_SHA256: e65324f4430c2717591937edcec90ccbefaf14c174f8ec9415e03ca875b46e1a
        run: |
          curl -sfL "https://github.com/zizmorcore/zizmor/releases/download/v${ZM_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz" -o /tmp/zm.tgz
          echo "${ZM_SHA256}  /tmp/zm.tgz" | sha256sum --check
          tar -xzf /tmp/zm.tgz -C /tmp
          /tmp/zizmor --min-severity medium --min-confidence medium .github/workflows/
      - name: Negative test for the pinning check (#143)
        run: |
          fixture=$(mktemp -d)
          printf 'jobs:\n  x:\n    steps:\n      - uses: actions/checkout@v4\n' > "$fixture/w.yml"
          if .github/scripts/check-pinned-actions.sh "$fixture"; then
            echo "check passed on an unpinned - uses: step - the check is broken"
            exit 1
          fi
          echo "Negative test passed."

  # Native-validation lane: exercises the real device bridge. Enable by
  # setting the ENABLE_NATIVE_VALIDATION repo variable to true once a
  # self-hosted Mac runner with a signed environment is registered; mocked
  # contract tests stay in the main lane above.
  native-validation:
    if: ${{ vars.ENABLE_NATIVE_VALIDATION == 'true' }}
    runs-on: [self-hosted, macos]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Read Flutter version
        run: echo "FLUTTER_VERSION=$(cat .flutter-version)" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get --enforce-lockfile
      - name: Integration tests on macOS
        run: flutter test integration_test -d macos
