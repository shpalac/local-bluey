name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  # Weekly dependency/vulnerability scan so new advisories against an
  # unchanged lockfile are noticed (#144). Only the security and
  # pinned-actions jobs run on schedule.
  schedule:
    - cron: '17 3 * * 1'

# Explicit bash => runs with -eo pipefail, so `flutter ... | tee log`
# fails the step when flutter fails (#142). Without it GitHub uses
# `bash -e`, and the step's exit code becomes tee's (always 0).
defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; jobs escalate only when they must.
permissions:
  contents: read

jobs:
  # Fast lane on Linux: format, static analysis and unit/widget tests.
  test:
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Single source of truth: .flutter-version at the repo root (#157).
      - name: Read Flutter version
        run: echo "FLUTTER_VERSION=$(cat .flutter-version)" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get --enforce-lockfile

      - name: Format check
        run: dart format --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Unit + widget tests (mocked contracts)
        run: flutter test --coverage --reporter expanded 2>&1 | tee test-output.log
        timeout-minutes: 8

      - name: Coverage thresholds (services/, link/) (#136)
        run: dart run tool/check_coverage.dart

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 14

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-logs
          path: test-output.log
          retention-days: 7

  # Builds stay on macOS: iOS/macOS outputs need Xcode. Skip the 25-minute
  # lane when the fast lane already failed or the change is docs-only (#144).
  build:
    if: ${{ github.event_name != 'schedule' }}
    needs: test
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Single source of truth: .flutter-version at the repo root (#157).
      - name: Read Flutter version
        run: echo "FLUTTER_VERSION=$(cat .flutter-version)" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get --enforce-lockfile

      - name: Build macOS
        run: flutter build macos 2>&1 | tee build-macos.log
        timeout-minutes: 12

      - name: Build iOS (no codesign)
        run: flutter build ios --no-codesign 2>&1 | tee build-ios.log
        timeout-minutes: 12

      - name: Build Android (debug APK)
        run: flutter build apk --debug 2>&1 | tee build-android.log
        timeout-minutes: 12

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-logs
          path: build-*.log
          retention-days: 3

  # Linux client build + tests on the generated linux/ runner (#149).
  # GTK3 stack + plugin system deps: tray_manager (ayatana-appindicator),
  # flutter_secure_storage (libsecret, libjsoncpp), nsd (Avahi),
  # record/audioplayers (ALSA), window_manager (GTK).
  linux:
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Single source of truth: .flutter-version at the repo root (#157).
      - name: Read Flutter version
        run: echo "FLUTTER_VERSION=$(cat .flutter-version)" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev libayatana-appindicator3-dev \
            libsecret-1-dev libjsoncpp-dev \
            libavahi-client-dev libasound2-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - run: flutter pub get --enforce-lockfile

      - name: Unit + widget tests
        run: flutter test --reporter expanded

      - name: Build Linux (release)
        run: flutter build linux --release

      - name: Package Linux tarball (#152)
        run: |
          set -euo pipefail
          bundle=$(echo build/linux/*/release/bundle)
          version=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          name="local-bluey-linux-x86_64-${version}"
          mkdir -p dist
          tar -C "$(dirname "$bundle")" -czf "dist/${name}.tar.gz" "$(basename "$bundle")"
          echo "PACKAGED=${name}.tar.gz" >> "$GITHUB_STEP_SUMMARY"
          sha256sum "dist/${name}.tar.gz" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Linux tarball
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-tarball
          path: dist/*.tar.gz
          retention-days: 14

      - name: Upload Linux bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-bundle
          path: build/linux/**/release/bundle
          retention-days: 14

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # gitleaks scans history

      - name: Read Flutter version
        run: echo "FLUTTER_VERSION=$(cat .flutter-version)" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get --enforce-lockfile

      # Pinned version + checksum, verified before execution (#144). Bump
      # deliberately: fetch the release asset and sha256sum it locally.
      - name: Dependency vulnerability scan (OSV)
        env:
          OSV_VERSION: v2.6.0
          OSV_SHA256: ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108
        run: |
          curl -sfL "https://github.com/google/osv-scanner/releases/download/${OSV_VERSION}/osv-scanner_linux_amd64" -o /tmp/osv-scanner
          echo "${OSV_SHA256}  /tmp/osv-scanner" | sha256sum --check
          chmod +x /tmp/osv-scanner
          /tmp/osv-scanner scan --lockfile=pubspec.lock

      # gitleaks: free for personal repos; an org repo would need a
      # GITLEAKS_LICENSE secret (#144). Fork PRs get a read-only token and
      # the scan reports without blocking on write checks.
      - name: Secrets scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SUMMARY: "true"

  # Fails if any third-party action is referenced by a movable tag instead of
  # a full-length commit SHA. The check matches both `- uses:` and bare
  # `uses:` forms (#143) and carries its own negative test.
  pinned-actions:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify actions are pinned by SHA
        run: .github/scripts/check-pinned-actions.sh
      - name: Negative test for the pinning check (#143)
        run: |
          fixture=$(mktemp -d)
          printf 'jobs:\n  x:\n    steps:\n      - uses: actions/checkout@v4\n' > "$fixture/w.yml"
          if .github/scripts/check-pinned-actions.sh "$fixture"; then
            echo "check passed on an unpinned - uses: step - the check is broken"
            exit 1
          fi
          echo "Negative test passed."

  # Native-validation lane: exercises the real device bridge. Enable by
  # removing `if: false` once a self-hosted Mac runner with a signed
  # environment is registered on the repo; mocked contract tests stay in the
  # main lane above.
  native-validation:
    if: ${{ false }} # enable when a self-hosted runner exists
    runs-on: [self-hosted, macos]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Read Flutter version
        run: echo "FLUTTER_VERSION=$(cat .flutter-version)" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get --enforce-lockfile
      - name: Integration tests on macOS
        run: flutter test integration_test -d macos
