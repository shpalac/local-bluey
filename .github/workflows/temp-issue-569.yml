name: Temporary BLU-016 acceptance
on:
  pull_request:
    paths:
      - 'lib/workflows/workflow_execution.dart'
      - 'test/workflow_execution_test.dart'
      - 'docs/blu-016-workflow-execution.md'
      - '.github/workflows/temp-issue-569.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  blu-016:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib/workflows/workflow_execution.dart test/workflow_execution_test.dart
      - run: dart analyze lib/workflows/workflow_execution.dart test/workflow_execution_test.dart
      - run: flutter test test/workflow_execution_test.dart
