name: BLU-004 lockfile bootstrap (temporary)

on:
  pull_request:
    paths:
      - pubspec.yaml
      - .github/workflows/temp-blu004-lock.yml

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Read Flutter version
        run: echo "FLUTTER_VERSION=$(cat .flutter-version)" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve new SQLCipher dependencies
        run: flutter pub get
      - name: Format changed Dart sources
        run: dart format lib/services/encrypted_activity_store.dart lib/services/activity_retention_policy.dart lib/services/data_registry.dart test/encrypted_activity_store_test.dart test/activity_retention_policy_test.dart
      - name: Capture formatter output for handoff
        run: |
          for file in lib/services/encrypted_activity_store.dart lib/services/activity_retention_policy.dart lib/services/data_registry.dart test/encrypted_activity_store_test.dart test/activity_retention_policy_test.dart; do
            echo "BEGIN_FORMATTED_FILE $file"
            base64 -w0 "$file"
            echo
            echo "END_FORMATTED_FILE $file"
          done
      - name: Focused SQLite and policy tests
        run: flutter test test/encrypted_activity_store_test.dart test/activity_store_test.dart test/activity_retention_policy_test.dart --reporter expanded
      - name: Analyze
        run: flutter analyze
      - name: Publish nonsecret lockfile for regeneration
        run: |
          echo BEGIN_RESOLVED_LOCK
          base64 -w0 pubspec.lock
          echo
          echo END_RESOLVED_LOCK
