name: Temporary BLU-020 acceptance
on:
  pull_request:
    paths:
      - 'lib/services/execution_audit.dart'
      - 'test/execution_audit_test.dart'
      - '.github/workflows/temp-issue-573.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: dart format --output=none --set-exit-if-changed lib/services/execution_audit.dart test/execution_audit_test.dart
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test test/execution_audit_test.dart
      - run: flutter build web --release
