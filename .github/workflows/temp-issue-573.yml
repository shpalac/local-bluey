name: Temporary BLU-020 acceptance
on:
  pull_request:
    paths:
      - 'lib/services/execution_audit.dart'
      - 'lib/workflows/workflow_execution.dart'
      - 'lib/ui/execution_audit_panel.dart'
      - 'test/execution_audit_test.dart'
      - 'docs/blu-020-execution-audit.md'
      - '.github/workflows/temp-issue-573.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Format BLU-020 files
        run: dart format lib/services/execution_audit.dart lib/workflows/workflow_execution.dart lib/ui/execution_audit_panel.dart test/execution_audit_test.dart
      - run: flutter analyze
      - run: flutter test test/execution_audit_test.dart test/workflow_execution_test.dart
      - run: flutter build web --release
