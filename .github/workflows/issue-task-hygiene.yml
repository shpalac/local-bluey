name: Issue task hygiene

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: read
  issues: write

jobs:
  task-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
jobs:
  task-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate issue task contract fixture tests
        run: python3 -m unittest discover -s tool -p test_issue_task_hygiene.py
      - name: Require issue acceptance criteria and CI validation plan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tool/issue_task_hygiene.py
