name: Temporary BLU-040 iOS Simulator CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ios-simulator-feasibility:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Read Flutter version
        run: echo "FLUTTER_VERSION=$(cat .flutter-version)" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed test/ios_simulator_feasibility_test.dart
      - run: flutter analyze
      - run: flutter test test/ios_simulator_feasibility_test.dart --reporter expanded
