name: Temporary BLU-019 recovery validation
on:
  pull_request:
    paths:
      - 'lib/workflows/workflow_recovery.dart'
      - 'test/workflow_recovery_test.dart'
      - '.github/workflows/temp-issue-572.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib/workflows/workflow_recovery.dart test/workflow_recovery_test.dart
      - run: flutter analyze lib/workflows/workflow_recovery.dart test/workflow_recovery_test.dart
      - run: flutter test test/workflow_recovery_test.dart test/workflow_execution_test.dart
      - run: flutter build bundle --release
