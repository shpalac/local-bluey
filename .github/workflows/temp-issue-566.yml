name: TEMP BLU-013 draft builder acceptance
on:
  pull_request:
    paths:
      - 'lib/teach_mode/draft_builder.dart'
      - 'test/teach_mode/draft_builder_test.dart'
      - '.github/workflows/temp-issue-566.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  blu-013:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib/teach_mode/draft_builder.dart test/teach_mode/draft_builder_test.dart
      - run: dart analyze lib/teach_mode/draft_builder.dart test/teach_mode/draft_builder_test.dart
      - run: flutter test test/teach_mode/draft_builder_test.dart
