name: README showcase screenshots

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - '.github/workflows/readme-showcase.yml'
      - 'tool/build_readme_showcase.py'
      - 'tool/regenerate_screenshots.sh'
      - 'test/screenshots/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    # Only the trusted same-repository branch; never execute fork PR code with write permissions.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'docs/readme-showcase-redesign') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || github.head_ref }}
          persist-credentials: true
      - name: Read pinned Flutter version
        run: echo "FLUTTER_VERSION=$(cat .flutter-version)" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Regenerate real Flutter golden screenshots
        run: bash tool/regenerate_screenshots.sh
      - name: Install image composition dependency
        run: python3 -m pip install --user Pillow==11.3.0
      - name: Compose screenshot-based showcase
        run: python3 tool/build_readme_showcase.py
      - name: Upload screenshots as run artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bluey-readme-showcase
          path: docs/screenshots/showcase/*.png
          retention-days: 30
      - name: Commit generated screenshots to the PR branch
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'docs/readme-showcase-redesign' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if ! git diff --cached --quiet; then
            git commit -m "docs: regenerate deterministic README screenshots"
            git push origin HEAD:docs/readme-showcase-redesign
          fi
