name: README showcase screenshots

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/readme-showcase.yml'
      - 'tool/build_readme_showcase.py'
      - 'tool/regenerate_screenshots.sh'
      - 'test/screenshots/**'
      - 'README.md'
      - 'docs/screenshots/**'
      - '.flutter-version'
      - 'pubspec.*'
  push:
    branches: [main]
    paths:
      - '.github/workflows/readme-showcase.yml'
      - 'tool/build_readme_showcase.py'
      - 'tool/regenerate_screenshots.sh'
      - 'test/screenshots/**'
      - 'README.md'
      - '.flutter-version'
      - 'pubspec.*'
  workflow_dispatch:
    inputs:
      publish:
        description: Open a screenshot refresh PR from main
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: readme-showcase-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      source: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record immutable source
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Read pinned Flutter version
        run: echo "FLUTTER_VERSION=$(cat .flutter-version)" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Regenerate real Flutter golden screenshots
        run: bash tool/regenerate_screenshots.sh
      - name: Install image composition dependency
        run: python3 -m pip install --user Pillow==11.3.0
      - name: Compose screenshot-based showcase
        run: python3 tool/build_readme_showcase.py
      - name: Verify all local README images exist
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          readme = Path("README.md").read_text(encoding="utf-8")
          sources = re.findall(r'<img\s+[^>]*src="([^"]+)"', readme)
          missing = [source for source in sources if not source.startswith(("http:", "https:")) and not Path(source).is_file()]
          if missing:
              raise SystemExit("Missing README images: " + ", ".join(missing))
          print(f"Verified {len(sources)} README image references")
          PY
      - name: Check screenshot freshness on pull requests
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          git fetch origin "${{ github.event.pull_request.base.sha }}" --depth=1
          if ! git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD -- test/screenshots tool/build_readme_showcase.py tool/regenerate_screenshots.sh .flutter-version pubspec.yaml pubspec.lock | grep -q .; then
            echo 'No screenshot source changes in this PR; freshness check deferred.'
            exit 0
          fi
          git diff --exit-code -- docs/screenshots || { echo '::error::Commit regenerated screenshots'; exit 1; }
          test -z "$(git ls-files --others --exclude-standard docs/screenshots)" || { echo '::error::Untracked generated screenshots'; exit 1; }
      - name: Upload screenshots as run artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bluey-readme-showcase
          path: docs/screenshots/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: render
    # Only explicit manual dispatch may write to the owner's README branch.
    # PR rendering uses a read-only token and never creates bot approval loops.
    if: ${{ github.ref_name == 'main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.render.outputs.source }}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: bluey-readme-showcase
          path: docs/screenshots
      - name: Open screenshot refresh PR
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.render.outputs.source }}
        run: |
          set -euo pipefail
          branch="automation/readme-screenshots-${SOURCE_SHA:0:12}"
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$SOURCE_SHA" ]; then
            echo '::error::main advanced; rerun to avoid stale screenshots'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/screenshots
          if git diff --cached --quiet; then
            echo 'Screenshots match main' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git switch -c "$branch"
          git commit -m 'docs: regenerate README screenshots' 
          git push origin "HEAD:refs/heads/$branch"
          gh pr create --base main --head "$branch" --title 'docs: refresh README screenshots' --body 'Regenerated deterministic Flutter test screenshots and showcase from latest main. CI verifies reproducibility; these are not physical-device captures.'
