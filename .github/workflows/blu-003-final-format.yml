name: BLU-003 final formatter

on:
  push:
    branches: [feat/blu-003-sensitive-content-gate]
    paths: ['.github/workflows/blu-003-final-format.yml']

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/blu-003-sensitive-content-gate
      - run: echo "FLUTTER_VERSION=$(cat .flutter-version)" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Format all Dart sources once
        run: dart format lib test
      - name: Persist canonical formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test
          if ! git diff --cached --quiet; then
            git commit -m "style: apply canonical Flutter formatter"
            git push origin HEAD:feat/blu-003-sensitive-content-gate
          fi
