name: Temporary BLU-028 acceptance
on:
  pull_request:
    paths:
      - 'lib/services/file_index.dart'
      - 'lib/ui/file_index_section.dart'
      - 'lib/ui/data_privacy_section.dart'
      - 'macos/Runner/MainFlutterWindow.swift'
      - 'lib/services/data_registry.dart'
      - 'test/file_index_test.dart'
      - 'docs/acceptance/temporary/issue-584.json'
      - '.github/workflows/temp-issue-584.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  file-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
      - run: flutter pub get
      - name: Verify Dart formatting
        run: dart format lib/services/file_index.dart lib/ui/file_index_section.dart test/file_index_test.dart
      - run: flutter analyze
      - run: flutter test test/file_index_test.dart
      - run: flutter build apk --debug
  macos-picker:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build macos --debug
