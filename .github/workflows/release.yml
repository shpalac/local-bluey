name: Release

# Tag-driven release pipeline (#155). Push vX.Y.Z (must match pubspec
# version) to build every platform, attach artifacts + SHA256SUMS +
# SBOM, and attest provenance. Signing/notarization slots in later (#39):
# put signing secrets in the protected `release` environment.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  attestations: write
  id-token: write

env:
  FLUTTER_VERSION: "3.47.6"

jobs:
  version-check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Tag must match pubspec version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pub=$(grep -E '^version:' pubspec.yaml | sed 's/version: \([0-9.]*\).*/\1/')
          echo "tag=$tag pubspec=$pub"
          [ "$tag" = "$pub" ] || { echo "tag/pubspec mismatch - bump pubspec.yaml"; exit 1; }

  test:
    needs: version-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Read Flutter version
        run: echo "FLUTTER_VERSION=$(cat .flutter-version)" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --set-exit-if-changed lib test tool
      - run: flutter analyze
      - run: flutter test

  build:
    needs: test
    runs-on: macos-latest
    timeout-minutes: 30
    environment: release
    strategy:
      matrix:
        target: [macos, ios, android]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Read Flutter version
        run: echo "FLUTTER_VERSION=$(cat .flutter-version)" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Build macOS
        if: matrix.target == 'macos'
        run: |
          flutter build macos --release
          (cd build/macos/Build/Products/Release && tar -czf "$OLDPWD/local-bluey-macos.tar.gz" .)
      - name: Build iOS
        if: matrix.target == 'ios'
        run: |
          flutter build ios --release --no-codesign
          (cd build/ios/iphoneos && tar -czf "$OLDPWD/local-bluey-ios.tar.gz" .)
      - name: Build Android
        if: matrix.target == 'android'
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk local-bluey-android.apk
      - name: Package artifact
        run: |
          artifact=$(ls local-bluey-*.{tar.gz,apk} 2>/dev/null | head -1)
          sha256sum "$artifact" > "$artifact.sha256"
          echo "ARTIFACT=$artifact" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.target }}
          path: |
            local-bluey-*.tar.gz
            local-bluey-*.apk
            local-bluey-*.sha256
          retention-days: 7
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.ARTIFACT }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: release-*
          merge-multiple: true
      - name: SBOM from pubspec.lock
        run: |
          echo "FLUTTER_VERSION=$(cat .flutter-version)" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get --enforce-lockfile
      - run: dart run tool/sbom.dart sbom.json
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha256sum local-bluey-*.tar.gz local-bluey-*.apk > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --generate-notes \
            local-bluey-*.tar.gz local-bluey-*.apk SHA256SUMS sbom.json
