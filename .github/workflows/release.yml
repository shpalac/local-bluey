name: Release

# Tag-driven release pipeline (#155). Push vX.Y.Z (must match pubspec
# version) to build every platform, attach artifacts + SHA256SUMS +
# SBOM, and attest provenance. Signing/notarization slots in later (#39):
# put signing secrets in the protected `release` environment.

on:
  push:
    tags: ['v*.*.*']

# Least privilege by default; jobs escalate only the grants they need
# (#160, zizmor excessive-permissions).
permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version-check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Tag must match pubspec version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pub=$(grep -E '^version:' pubspec.yaml | sed 's/version: \([0-9.]*\).*/\1/')
          echo "tag=$tag pubspec=$pub"
          [ "$tag" = "$pub" ] || { echo "tag/pubspec mismatch - bump pubspec.yaml"; exit 1; }

  test:
    needs: version-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Read Flutter version
        run: echo "FLUTTER_VERSION=$(cat .flutter-version)" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --set-exit-if-changed lib test tool
      - run: flutter analyze
      - run: flutter test --coverage --file-reporter json:test-report.jsonl --timeout 90s
      - run: dart run tool/check_coverage.dart
      - name: Structured test results
        if: ${{ always() }}
        run: |
          status=0
          python3 tool/test_report.py test-report.jsonl --junit test-results.xml > test-summary.md || status=$?
          cat test-summary.md >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Upload release test evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-test-evidence
          path: |
            test-report.jsonl
            test-results.xml
            test-summary.md
            coverage/lcov.info
          retention-days: 14

  build:
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      id-token: write # attest-build-provenance
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos
            os: macos-latest
            artifact: local-bluey-macos.tar.gz
          - target: ios
            os: macos-latest
            artifact: local-bluey-ios.tar.gz
          - target: android
            os: ubuntu-latest
            artifact: local-bluey-android.apk
          - target: linux
            os: ubuntu-latest
            artifact: local-bluey-linux-x86_64.tar.gz
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Read Flutter version
        run: echo "FLUTTER_VERSION=$(cat .flutter-version)" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Set up Java for Android
        if: matrix.target == 'android'
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Linux build dependencies
        if: matrix.target == 'linux'
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: clang cmake ninja-build pkg-config libgtk-3-dev libayatana-appindicator3-dev libsecret-1-dev libjsoncpp-dev libavahi-client-dev libasound2-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - run: flutter pub get --enforce-lockfile
      - name: Build macOS
        if: matrix.target == 'macos'
        run: |
          flutter build macos --release
          (cd build/macos/Build/Products/Release && tar -czf "$OLDPWD/local-bluey-macos.tar.gz" .)
      - name: Build iOS
        if: matrix.target == 'ios'
        run: |
          flutter build ios --release --no-codesign
          (cd build/ios/iphoneos && tar -czf "$OLDPWD/local-bluey-ios.tar.gz" .)
      - name: Build Android
        if: matrix.target == 'android'
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk local-bluey-android.apk
      - name: Build Linux
        if: matrix.target == 'linux'
        run: |
          flutter build linux --release
          tar -C build/linux/x64/release -czf local-bluey-linux-x86_64.tar.gz bundle
      - name: Package checksum
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          test -s "$ARTIFACT"
          if command -v sha256sum >/dev/null; then
            sha256sum "$ARTIFACT" > "$ARTIFACT.sha256"
          else
            shasum -a 256 "$ARTIFACT" > "$ARTIFACT.sha256"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-build-${{ matrix.target }}
          path: |
            local-bluey-*.tar.gz
            local-bluey-*.apk
            local-bluey-*.sha256
          if-no-files-found: error
          retention-days: 7
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ matrix.artifact }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write # gh release create
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: release-build-*
          merge-multiple: true
      - name: SBOM from pubspec.lock
        run: |
          echo "FLUTTER_VERSION=$(cat .flutter-version)" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get --enforce-lockfile
      - run: dart run tool/sbom.dart sbom.json
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test "$(find . -maxdepth 1 -name 'local-bluey-*.sha256' | wc -l)" -eq 4
          cat local-bluey-*.sha256 > SHA256SUMS
          sha256sum --check SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --generate-notes \
            local-bluey-*.tar.gz local-bluey-*.apk SHA256SUMS sbom.json
